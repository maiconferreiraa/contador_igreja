<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Presença</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
    <style>
        body {
            background-color: #f0f2f5; /* Cor de fundo suave */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .contador-container {
            max-width: 500px;
            width: 100%;
            background: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.07);
        }
        #data-atual {
            font-size: 1.1rem;
            font-weight: 500;
            color: #0d6efd; /* Azul primário do Bootstrap */
            text-align: center;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #eee;
            padding-bottom: 1rem;
        }
        .form-floating label {
            font-size: 0.9rem;
        }
        .btn-whatsapp {
            background-color: #25D366;
            border-color: #25D366;
            color: white;
            font-weight: bold;
        }
        .btn-whatsapp:hover {
            background-color: #1EAE50;
            border-color: #1EAE50;
            color: white;
        }
    </style>
</head>
<body>

    <div class="contador-container">
        <h2 class="text-center mb-3">Contador de Presença</h2>
        
        <div id="data-atual"></div>

        <form id="contador-form">
            
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="nome-igreja" placeholder="Nome da Igreja" required>
                <label for="nome-igreja">Nome da Igreja</label>
            </div>

            <hr class="my-3">
            
            <h5 class="mb-3">Membros</h5>
            <div class="row g-2 mb-3">
                <div class="col">
                    <div class="form-floating">
                        <input type="number" class="form-control" id="membros-adultos" placeholder="Adultos" min="0" value="0">
                        <label for="membros-adultos">Adultos</label>
                    </div>
                </div>
                <div class="col">
                    <div class="form-floating">
                        <input type="number" class="form-control" id="membros-cias" placeholder="Crianças" min="0" value="0">
                        <label for="membros-cias">Crianças (CIAs)</label>
                    </div>
                </div>
            </div>

            <h5 class="mb-3">Visitantes</h5>
            <div class="row g-2 mb-3">
                <div class="col">
                    <div class="form-floating">
                        <input type="number" class="form-control" id="visitantes-adultos" placeholder="Adultos" min="0" value="0">
                        <label for="visitantes-adultos">Adultos</label>
                    </div>
                </div>
                <div class="col">
                    <div class="form-floating">
                        <input type="number" class="form-control" id="visitantes-cias" placeholder="Crianças" min="0" value="0">
                        <label for="visitantes-cias">Crianças (CIAs)</label>
                    </div>
                </div>
            </div>
            
            <button type="submit" class="btn btn-whatsapp w-100 btn-lg mt-3">
                Gerar Relatório para WhatsApp
            </button>
            
        </form>
    </div>

    <script>
        // Função auxiliar para capitalizar a primeira letra (ex: "segunda-feira" -> "Segunda-feira")
        function capitalizar(string) {
            return string.charAt(0).toUpperCase() + string.slice(1);
        }

        // Executa quando a página terminar de carregar
        document.addEventListener('DOMContentLoaded', function() {
            
            // --- LÓGICA DA DATA ---
            const hoje = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            // Formata a data para o padrão pt-BR (ex: "segunda-feira, 3 de novembro de 2025")
            let dataFormatada = hoje.toLocaleDateString('pt-BR', options);
            
            // Capitaliza o dia da semana e o mês
            dataFormatada = dataFormatada.split(', ').map(capitalizar).join(', ');
            dataFormatada = dataFormatada.replace(' De ', ' de '); // Ajuste fino para o "de" minúsculo

            // Exibe a data no elemento HTML
            document.getElementById('data-atual').innerText = dataFormatada;

            
            // --- LÓGICA DO FORMULÁRIO E WHATSAPP ---
            const form = document.getElementById('contador-form');
            form.addEventListener('submit', function(event) {
                // Impede que o formulário recarregue a página
                event.preventDefault(); 

                // Pega a data que já exibimos na tela
                const dataTexto = document.getElementById('data-atual').innerText;

                // Pega os valores dos campos
                const nomeIgreja = document.getElementById('nome-igreja').value;
                const mA = parseInt(document.getElementById('membros-adultos').value) || 0;
                const mC = parseInt(document.getElementById('membros-cias').value) || 0;
                const vA = parseInt(document.getElementById('visitantes-adultos').value) || 0;
                const vC = parseInt(document.getElementById('visitantes-cias').value) || 0;

                // Calcula os totais
                const totalMembros = mA + mC;
                const totalVisitantes = vA + vC;
                const totalGeral = totalMembros + totalVisitantes;

                // 7. Formata a mensagem para o WhatsApp
                // Usamos *texto* para negrito e _texto_ para itálico no WhatsApp
                const mensagemTexto = `
*RELATÓRIO DE PRESENÇA*
Igreja: *${nomeIgreja}*
Data: _${dataTexto}_

-----------------------------------

*MEMBROS*
Adultos: ${mA}
Crianças: ${mC}
*Total Membros: ${totalMembros}*

-----------------------------------

*VISITANTES*
Adultos: ${vA}
Crianças: ${vC}
*Total Visitantes: ${totalVisitantes}*

-----------------------------------

*TOTAL GERAL: ${totalGeral}*
                `;

                // 8. Prepara a URL para o WhatsApp
                // Precisamos codificar a mensagem para que funcione em uma URL
                const mensagemCodificada = encodeURIComponent(mensagemTexto);
                
                // Este é o link "clique para conversar" do WhatsApp. 
                // Sem número, ele abre a lista de contatos para o usuário escolher.
                const urlWhatsApp = `https://wa.me/?text=${mensagemCodificada}`;

                // 9. Abre a URL do WhatsApp em uma nova aba
                window.open(urlWhatsApp, '_blank');
            });
        });
    </script>
    
</body>
</html>
