<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login do Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- LINK PARA OS ÍCONES (OLHO) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f2f5;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
        }
        /* NOVO CSS PARA POSICIONAR O ÍCONE */
        .password-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #6c757d; /* Cinza 'text-muted' */
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                <h2 class="text-center mb-4">Login do Admin</h2>
                
                <form id="login-form">
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="email" placeholder="seu@email.com" required>
                        <label for="email">Email</label>
                    </div>
                    <!-- CAMPO DE SENHA ATUALIZADO -->
                    <div class="form-floating mb-3 position-relative">
                        <input type="password" class="form-control" id="password" placeholder="Sua senha" required>
                        <label for="password">Senha</label>
                        <!-- ÍCONE DO OLHO -->
                        <span id="toggle-password" class="password-icon">
                            <i class="bi bi-eye-fill"></i>
                        </span>
                    </div>
                    
                    <div id="login-error" class="alert alert-danger d-none" role="alert"></div>
                    
                    <button type="submit" class="btn btn-primary w-100 btn-lg">Entrar</button>
                    <a href="index.html" class="btn btn-link w-100 mt-2">Voltar</a>
                </form>
            </div>
        </div>
    </div>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
