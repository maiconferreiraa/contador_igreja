<!DOCTYPE html>
<!-- O atributo data-bs-theme="dark" ativa o tema escuro -->
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login do Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- LINK PARA OS ÍCONES (OLHO) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-header">
            <div class="brand-icon"><i class="bi bi-shield-lock-fill"></i></div>
            <h2>Login do Admin</h2>
            <span class="brand-subtitle">Contador ICM</span>
        </div>
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">

                <form id="login-form">
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="email" placeholder="seu@email.com" required>
                        <label for="email">Email</label>
                    </div>
                    <!-- CAMPO DE SENHA ATUALIZADO -->
                    <div class="form-floating mb-3 position-relative">
                        <input type="password" class="form-control" id="password" placeholder="Sua senha" required>
                        <label for="password">Senha</label>
                        <!-- ÍCONE DO OLHO -->
                        <span id="toggle-password" class="password-icon">
                            <i class="bi bi-eye-fill"></i>
                        </span>
                    </div>
                    
                    <div id="login-error" class="alert alert-danger d-none" role="alert"></div>
                    
                    <button type="submit" class="btn btn-primary w-100 btn-lg">Entrar</button>
                    <a href="index.html" class="btn btn-link w-100 mt-2">Voltar</a>
                </form>
            </div>
        </div>
    </div>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
