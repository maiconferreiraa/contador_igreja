<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Presença</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; }
        .container { max-width: 600px; }
        /* Estilo para o botão do WhatsApp */
        .btn-whatsapp {
            background-color: #25D366;
            border-color: #25D366;
            color: white;
        }
        .btn-whatsapp:hover {
            background-color: #1EAE50;
            border-color: #1EAE50;
            color: white;
        }
    </style>
</head>
<body class="py-5">

    <div class="container">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">
                <h2 class="text-center mb-3">Contador de Presença</h2>
                
                <div id="data-atual" class="text-center text-primary fw-bold mb-4"></div>
                
                <div id="mensagem-sucesso" class="alert alert-success d-none" role="alert">
                  Dados salvos com sucesso!
                </div>

                <form id="contador-form">
                    
                    <div class="form-floating mb-3">
                        <select class="form-select" id="nome-igreja" aria-label="Nome da Igreja" required>
                            <option value="" selected disabled>Selecione a Igreja</option>
                            <option value="LAGOA SANTA - CENTRO">LAGOA SANTA - CENTRO</option>
                            <option value="LAGOA SANTA - VÁRZEA">LAGOA SANTA - VÁRZEA</option>
                            <option value="PEDRO LEOPOLDO - CENTRO">PEDRO LEOPOLDO - CENTRO</option>
                            <option value="PEDRO LEOPOLDO - FELIPE CLÁUDIO">PEDRO LEOPOLDO - FELIPE CLÁUDIO</option>
                            <option value="SÃO JOSE DA LAPA">SÃO JOSE DA LAPA</option>
                            <option value="VESPASIANO">VESPASIANO</option>
                        </select>
                        <label for="nome-igreja">Nome da Igreja</label>
                    </div>

                    <h5 class="mb-2 mt-4">Membros</h5>
                    <div class="row g-2 mb-3">
                        <div class="col">
                            <div class="form-floating">
                                <input type="number" class="form-control" id="membros-adultos" placeholder="Adultos" min="0" value="0" required>
                                <label for="membros-adultos">Adultos</LAbel>
                            </div>
                        </div>
                        <div class="col">
                            <div class="form-floating">
                                <input type="number" class="form-control" id="membros-cias" placeholder="Crianças" min="0" value="0" required>
                                <label for="membros-cias">Crianças (CIAs)</label>
                            </div>
                        </div>
                    </div>

                    <h5 class="mb-2 mt-4">Visitantes</h5>
                    <div class="row g-2 mb-3">
                        <div class="col">
                            <div class="form-floating">
                                <input type="number" class="form-control" id="visitantes-adultos" placeholder="Adultos" min="0" value="0" required>
                                <label for="visitantes-adultos">Adultos</label>
                            </div>
                        </div>
                        <div class="col">
                            <div class="form-floating">
                                <input type="number" class="form-control" id="visitantes-cias" placeholder="Crianças" min="0" value="0" required>
                                <label for="visitantes-cias">Crianças (CIAs)</label>
                            </div>
                        </div>
                    </div>
                    
                    <button type="submit" id="btn-salvar" class="btn btn-primary w-100 btn-lg mt-3">
                        Salvar Relatório
                    </button>
                    
                    <button type="button" id="btn-whatsapp" class="btn btn-whatsapp w-100 btn-lg mt-2 d-none">
                        Compartilhar no WhatsApp
                    </button>
                    <a href="login.html" class="btn btn-outline-secondary w-100 mt-3">Área do Admin</a>
                </form>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
